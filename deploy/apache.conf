ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
        <FilesMatch "^(?!index\.php$).*\.php$">
            Require all denied
        </FilesMatch>
    </Directory>
    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>
    # No query strings (which may contain personal information) in access logs.
    LogFormat "%a %t \"%m %U %H\" %>s %b" privacy
    CustomLog /proc/self/fd/1 privacy
    ErrorLog /proc/self/fd/2
</VirtualHost>
