expose_php=Off
display_errors=Off
log_errors=On
memory_limit=256M
upload_max_filesize=10M
post_max_size=32M
max_execution_time=60
opcache.enable=1
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
; Code changes arrive with a new container; restart after each deployment.
opcache.validate_timestamps=0
session.use_strict_mode=1
